name: keeptally-dev

services:
  keeptally-dev:
    network_mode: host
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_VOICE_COUNT_TTS_ENABLED: ${VITE_VOICE_COUNT_TTS_ENABLED:-false}
        VITE_VOICE_COUNT_CONFIRMATION_AUDIO_ENABLED: ${VITE_VOICE_COUNT_CONFIRMATION_AUDIO_ENABLED:-true}
    image: keeptally:dev
    restart: unless-stopped
    env_file:
      - ${KEEP_TALLY_DEV_ENV_FILE:-.env.vps-dev}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/api/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
