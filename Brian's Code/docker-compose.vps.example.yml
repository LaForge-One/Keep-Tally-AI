services:
  keeptally:
    build:
      context: .
      dockerfile: Dockerfile
    image: keeptally:test
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      # Bind to localhost so public traffic must pass through the HTTPS reverse proxy/access gate.
      - "127.0.0.1:${KEEP_TALLY_HOST_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/api/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
