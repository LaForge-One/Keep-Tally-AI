# Ollama-first AI overlay for KeepTally VPS.
# Usage:
#   docker compose -f docker-compose.vps.example.yml -f docker-compose.ollama-ai.example.yml --env-file .env.production --env-file .env.ai up -d
#
# Ollama is internal-only. Open WebUI binds to 127.0.0.1 by default and should be
# exposed only through SSH tunnel, VPN, or an authenticated reverse proxy.

services:
  keeptally:
    environment:
      AI_INTEGRATIONS_OPENAI_BASE_URL: http://ollama:11434/v1
      AI_INTEGRATIONS_OPENAI_API_KEY: ${OLLAMA_OPENAI_API_KEY:-ollama-local}
      AI_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-qwen2.5:3b}
      AI_COMMAND_MODEL: ${OLLAMA_COMMAND_MODEL:-qwen2.5:3b}
      AI_VOICE_PARSE_MODEL: ${OLLAMA_VOICE_PARSE_MODEL:-qwen2.5:3b}
      AI_AGENT_MODEL: ${OLLAMA_AGENT_MODEL:-qwen2.5:3b}
      AI_REALTIME_ENABLED: "false"
      AI_SELF_HOSTED_ENABLED: "true"
    depends_on:
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test:
        [
          "CMD",
          "ollama",
          "list"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "true"
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-8088}:8080"
    depends_on:
      - ollama
    profiles:
      - ai-ui

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-127.0.0.1}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-this-before-real-use}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Phoenix}
      OLLAMA_BASE_URL: http://ollama:11434
      OPENAI_API_BASE_URL: http://ollama:11434/v1
      OPENAI_API_KEY: ${OLLAMA_OPENAI_API_KEY:-ollama-local}
    volumes:
      - n8n-data:/home/node/.n8n
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    depends_on:
      - ollama
    profiles:
      - automation

volumes:
  ollama-data:
  open-webui-data:
  n8n-data:
